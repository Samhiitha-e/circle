version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.12

    steps:
      - checkout

      - run:
          name: Install Dependencies
          command: pip install -r requirements.txt

      - run:
          name: Run Tests
          command: pytest test_app.py

workflows:
  version: 2
  build-workflow:
    jobs:
      - build